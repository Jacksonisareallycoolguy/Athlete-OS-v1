<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a101c"><title>Athlete OS | Football Tracker</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9effb;background:#090e19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#172846,#090e19 60%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #67a7ff;outline-offset:2px}.app{max-width:850px;margin:auto;padding:20px 18px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#3388ff,#895eff);display:grid;place-items:center;font-size:24px;font-weight:900}.eyebrow{font-size:10px;letter-spacing:2px;color:#8b9bb7;font-weight:800}.brandname{font-weight:900;letter-spacing:.6px}.muted{color:#92a1ba}.small{font-size:12px}.heading{font-size:29px;letter-spacing:-1px;margin:5px 0 6px}.intro{margin:0 0 22px;color:#91a0ba;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{background:#141e30;border:1px solid #24344c;border-radius:18px;padding:17px}.statlabel{font-size:11px;font-weight:800;color:#91a4c2;letter-spacing:.6px}.statval{font-size:30px;font-weight:850;letter-spacing:-1px;margin:13px 0 2px}.unit{font-size:12px;color:#93a4bf}.green{color:#53dcaa}.blue{color:#74adff}.section{display:flex;align-items:center;justify-content:space-between;margin:27px 0 12px}.section h2{font-size:17px;margin:0}.ghost{background:#1c2b44;border:1px solid #30435e;color:#d9e7ff;border-radius:11px;padding:9px 12px;font-weight:650}.primary{background:#4188ff;border:0;color:#fff;border-radius:12px;padding:13px 16px;font-weight:800}.primary:disabled{opacity:.45}.full{width:100%}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #26364e}.item:last-child{border-bottom:0}.item strong{font-size:14px}.item .muted{font-size:12px;margin-top:4px}.item button{flex-shrink:0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#10192af5;backdrop-filter:blur(12px);border-top:1px solid #283951;padding:9px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:4}.tabs>div{width:min(100%,700px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tab{background:none;border:0;color:#8497b4;border-radius:11px;padding:10px 2px;font-size:11px;display:grid;gap:4px;justify-items:center}.tab .sym{font-size:21px}.tab.active{color:#fff;background:#213554}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:#b8c9e3}input,select{width:100%;background:#0d1727;border:1px solid #334762;border-radius:12px;color:#f2f7ff;padding:13px;min-height:45px}select option{background:#0d1727}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:9px}.chip{white-space:nowrap;border-radius:50px;border:1px solid #30435e;background:#162339;color:#a9bad5;padding:8px 12px;font-size:12px}.chip.selected{background:#326fd5;border-color:#326fd5;color:white}.metriccard{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#141e30;border:1px solid #24344c;color:#edf3ff;padding:16px;border-radius:14px;margin:9px 0}.metriccard small{display:block;color:#90a2bc;margin-top:5px}.chart{width:100%;height:190px;background:#0e1829;border-radius:12px;overflow:hidden}.chart svg{width:100%;height:100%}.hint{padding:14px;background:#192842;border-radius:12px;font-size:13px;color:#bbcae0;line-height:1.5}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.empty{text-align:center;padding:36px 16px;color:#9fb0cb}.warning{color:#f4c47d;font-size:12px}.good{color:#55dcaa;font-size:12px}.danger{background:#42232d;border:1px solid #70404d;color:#ffb6c3}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#27513d;border:1px solid #4d956f;border-radius:12px;padding:12px 20px;z-index:6;display:none}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:12px}.spaced{margin-top:16px}@media(min-width:650px){.app{padding-top:32px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app" class="app"></div><div id="toast" class="toast" role="status"></div><script>
const categories={"Speed & Acceleration":[["5-yard sprint","sec","low"],["10-yard sprint","sec","low"],["20-yard sprint","sec","low"],["40-yard dash","sec","low"],["Flying 10-yard sprint","sec","low"],["Curved sprint speed","sec","low"],["Repeated sprint ability","sec","low"],["Speed endurance","sec","low"],["Top speed","mph","high"]],"Explosiveness & Jumping":[["Standing vertical jump","in","high"],["Standing broad jump","in","high"]],"Strength & Muscle":[["Squat estimated 1RM","lb","high"],["Trap-bar deadlift estimated 1RM","lb","high"],["Bench press estimated 1RM","lb","high"],["Maximum strict pull-ups","reps","high"],["Grip strength","lb","high"],["Maximum push-ups","reps","high"],["Relative squat strength","×BW","high"],["Relative bench strength","×BW","high"]],"Agility & Change of Direction":[["5-10-5 shuttle","sec","low"],["3-cone drill","sec","low"],["45° cut drill","sec","low"],["90° cut drill","sec","low"]],"Wide Receiver Skills":[["Drop percentage","%","low"]],"Safety & Defensive Skills":[["10-yard backpedal speed","sec","low"]],"Body Size & Development":[["Body weight","lb","neutral"],["Height","in","neutral"],["Standing reach","in","neutral"],["Wingspan","in","neutral"],["Waist circumference","in","neutral"],["Chest circumference","in","neutral"],["Upper-arm circumference","in","neutral"],["Thigh circumference","in","neutral"],["Calf circumference","in","neutral"],["Body composition estimate","%","neutral"],["Relative strength ratios","×BW","high"],["Jump performance relative to body weight","in/lb","neutral"]]};
const metrics=Object.entries(categories).flatMap(([category,rows])=>rows.map(([name,unit,better])=>({id:name,category,name,unit,better})));const byId=id=>metrics.find(m=>m.id===id);const key='athlete-os-v1-results';let results=[];try{results=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(results))results=[]}catch{results=[]}let page='home',category='All',selected='40-yard dash';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:3});const dated=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});const sorted=id=>results.filter(r=>r.metric===id).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);const latest=id=>sorted(id).at(-1);const best=id=>{let a=sorted(id),m=byId(id);if(!a.length)return null;if(m.better==='neutral')return a.at(-1);return a.reduce((x,y)=>m.better==='low'?(x.value<y.value?x:y):(x.value>y.value?x:y))};const label=(m,r)=>r?fmt(r.value)+' '+m.unit:'—';const section=(title,body)=>`<div class="section"><h2>${title}</h2></div>${body}`;function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}function save(){localStorage.setItem(key,JSON.stringify(results))}function nav(p){page=p;render();scrollTo(0,0)}function choose(id){selected=id;nav('detail')}function navHtml(){return `<nav class="tabs"><div>${[['home','⌂','Home'],['metrics','▤','Metrics'],['add','＋','Add Result'],['progress','▥','Progress']].map(([p,ic,t])=>`<button class="tab ${page===p?'active':''}" onclick="nav('${p}')"><span class="sym">${ic}</span>${t}</button>`).join('')}</div></nav>`}function header(){return `<div class="top"><div class="brand"><div class="logo">↗</div><div><div class="brandname">ATHLETE OS</div><div class="eyebrow">FOOTBALL DEVELOPMENT</div></div></div><button class="ghost" onclick="nav('settings')">⚙</button></div>`}function home(){let featured=['40-yard dash','Standing vertical jump','Bench press estimated 1RM','Body weight'];return `<div class="eyebrow">YOUR PERFORMANCE</div><h1 class="heading">Development Dashboard</h1><p class="intro">Train on your schedule. Log whenever you want.</p><div class="grid">${featured.map(id=>{let m=byId(id),r=latest(id);return `<div class="panel"><div class="statlabel">${esc(id.replace(' estimated 1RM','').toUpperCase())}</div><div class="statval">${r?fmt(r.value):'—'} <span class="unit">${r?m.unit:''}</span></div><div class="small muted">${r?dated(r.date):'No results yet'}</div></div>`}).join('')}</div>${section('Quick actions',`<div class="row"><button class="primary" onclick="nav('add')">＋ Add result</button><button class="ghost" onclick="nav('metrics')">Browse 37 metrics</button></div>`)}${section('Recent results',results.length?`<div class="panel">${results.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,6).map(r=>`<div class="item"><div><strong>${esc(r.metric)}</strong><div class="muted">${dated(r.date)}</div></div><strong>${fmt(r.value)} ${byId(r.metric).unit}</strong></div>`).join('')}</div>`:`<div class="empty panel">No results recorded yet.<br><br><button class="primary" onclick="nav('add')">Log your first test</button></div>`)}<p class="intro spaced">No scheduled tests. No streaks. Your data, your pace.</p>`}function metricList(){let cats=['All',...Object.keys(categories)];return `<h1 class="heading">Your Metrics</h1><p class="intro">All ${metrics.length} tracked measurements, ready whenever you are.</p><div class="filters">${cats.map((c,i)=>`<button class="chip ${category===c?'selected':''}" onclick="category=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${i===0?'All':esc(c)}</button>`).join('')}</div>${metrics.filter(m=>category==='All'||m.category===category).map(m=>`<button class="metriccard" onclick="choose(${JSON.stringify(m.id).replace(/"/g,'&quot;')})"><span><strong>${esc(m.name)}</strong><small>${esc(m.category)}</small></span><span style="text-align:right"><strong>${label(m,latest(m.id))}</strong><small>${latest(m.id)?'Last '+dated(latest(m.id).date):'Not tested'} →</small></span></button>`).join('')}`}function options(sel){return metrics.map(m=>`<option value="${esc(m.id)}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('')}function add(){let m=byId(selected);return `<h1 class="heading">Add a Result</h1><p class="intro">Any metric. Any day. No required schedule.</p><form id="entry" class="panel"><div class="field"><label for="metric">Metric</label><select id="metric" onchange="selected=this.value;render()">${options(selected)}</select></div><div class="field"><label for="value">Result (${esc(m.unit)})</label><input id="value" type="number" inputmode="decimal" step="any" min="0" required placeholder="Enter a number"></div><div class="field"><label for="date">Date tested</label><input id="date" type="date" required value="${new Date().toLocaleDateString('en-CA')}"></div><div class="field"><label for="note">Notes (optional)</label><input id="note" maxlength="240" placeholder="Surface, shoes, conditions, etc."></div><button class="primary full" type="submit">Save result</button></form><div class="hint spaced">Tip: For estimated 1RM, enter your calculated estimate. Future versions can calculate this from weight and reps automatically.</div>`}function plot(data,unit){if(!data.length)return '<div class="empty">No data to chart yet.</div>';if(data.length===1)return '<div class="empty">Add another result to see a trend.</div>';let vals=data.map(d=>d.value),mn=Math.min(...vals),mx=Math.max(...vals),spread=mx-mn||1;let pts=data.map((d,i)=>[22+i*(336/Math.max(1,data.length-1)),165-((d.value-mn)/spread)*130]);return `<div class="chart"><svg viewBox="0 0 380 190" preserveAspectRatio="none" aria-label="Results trend"><path d="M20 35H360 M20 100H360 M20 165H360" stroke="#263a55" stroke-width="1" fill="none"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" stroke="#5ba4ff" stroke-width="3" fill="none"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#79b7ff"/>`).join('')}<text x="20" y="18" fill="#a5b8d2" font-size="11">${fmt(mx)} ${esc(unit)}</text><text x="20" y="181" fill="#a5b8d2" font-size="11">${fmt(mn)} ${esc(unit)}</text></svg></div>`}function detail(){let m=byId(selected),data=sorted(selected),b=best(selected),last=latest(selected),first=data[0],improve=first&&last&&first.value>0&&m.better!=='neutral'?((m.better==='low'?first.value-last.value:last.value-first.value)/first.value*100):null;return `<button class="ghost" onclick="nav('metrics')">← All metrics</button><div class="eyebrow spaced">${esc(m.category)}</div><h1 class="heading">${esc(m.name)}</h1><p class="intro">Measured in ${esc(m.unit)} · ${m.better==='low'?'Lower is better':m.better==='high'?'Higher is better':'Track changes over time'}</p><div class="grid"><div class="panel"><div class="statlabel">LATEST</div><div class="statval">${label(m,last)}</div></div><div class="panel"><div class="statlabel">${m.better==='neutral'?'MOST RECENT':'PERSONAL RECORD'}</div><div class="statval">${label(m,b)}</div></div></div>${improve!==null?`<div class="hint spaced">${improve>=0?'▲':'▼'} ${Math.abs(improve).toFixed(1)}% ${improve>=0?'improvement':'change in the wrong direction'} from your first result.</div>`:''}${section('Progress',`<div class="panel">${plot(data,m.unit)}</div>`)}<div class="section"><h2>History (${data.length})</h2><button class="primary" onclick="selected=${JSON.stringify(m.id).replace(/"/g,'&quot;')};nav('add')">＋ Log</button></div><div class="panel">${data.length?data.slice().reverse().map(r=>`<div class="item"><div><strong>${fmt(r.value)} ${esc(m.unit)}</strong><div class="muted">${dated(r.date)}${r.note?' · '+esc(r.note):''}</div></div><button class="ghost mini" onclick="removeResult('${r.id}')">Delete</button></div>`).join(''):'<div class="empty">No measurements yet.</div>'}</div>`}function progress(){let tested=metrics.filter(m=>sorted(m.id).length);return `<h1 class="heading">Progress</h1><p class="intro">Personal records and trends from your recorded tests.</p><div class="grid"><div class="panel"><div class="statlabel">METRICS TESTED</div><div class="statval">${tested.length}<span class="unit"> / ${metrics.length}</span></div></div><div class="panel"><div class="statlabel">RESULTS LOGGED</div><div class="statval">${results.length}</div></div></div>${section('Explore trends',tested.length?tested.map(m=>`<button class="metriccard" onclick="choose(${JSON.stringify(m.id).replace(/"/g,'&quot;')})"><span><strong>${esc(m.name)}</strong><small>${sorted(m.id).length} results</small></span><span><strong>${label(m,best(m.id))} →</strong></span></button>`).join(''):'<div class="empty panel">Start logging results to unlock progress charts.</div>')}`}function settings(){return `<h1 class="heading">Settings & Data</h1><p class="intro">This V1 demo saves to this browser only. Data will not automatically transfer to another device.</p><div class="panel"><h3>Export your data</h3><p class="muted small">Download a CSV backup. Do this regularly before clearing browser data.</p><button class="primary" onclick="exportCSV()">↓ Export CSV</button></div><div class="panel spaced"><h3>Import results</h3><p class="muted small">Restore a CSV previously exported from this app. Imported results are merged by ID.</p><input type="file" id="importFile" accept=".csv,text/csv" onchange="importCSV(this.files[0])"></div><div class="panel spaced"><h3>About this version</h3><p class="muted small">Offline-capable single-page tracker with ${metrics.length} metrics, personal records, charts and unlimited on-demand entries. Supabase syncing and authentication are not included yet.</p></div>`}function removeResult(id){if(!confirm('Delete this result?'))return;results=results.filter(r=>r.id!==id);save();render();toast('Result deleted')}function exportCSV(){let lines=[['id','metric','value','date','note','created'],...results.map(r=>[r.id,r.metric,r.value,r.date,r.note||'',r.created])];let csv=lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='athlete-os-backup-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function parseCSV(str){let rows=[],row=[],cell='',quote=false;for(let i=0;i<str.length;i++){let c=str[i];if(quote){if(c==='"'&&str[i+1]==='"'){cell+='"';i++}else if(c==='"')quote=false;else cell+=c}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}async function importCSV(file){if(!file)return;try{let rows=parseCSV(await file.text());if(rows[0].join(',')!=='id,metric,value,date,note,created')throw Error('Not an Athlete OS export');let n=0;for(let a of rows.slice(1)){let [id,metric,value,date,note,created]=a;if(!id||!byId(metric)||!Number.isFinite(+value)||+value<0||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date))continue;if(!results.some(r=>r.id===id)){results.push({id,metric,value:+value,date,note,created:+created||Date.now()});n++}}save();render();toast('Imported '+n+' results')}catch(e){alert('Import failed: '+e.message)}}function render(){let views={home,metrics:metricList,add,progress,detail,settings};$('app').innerHTML=header()+views[page]()+navHtml();if(page==='add')$('entry').addEventListener('submit',e=>{e.preventDefault();let val=Number($('value').value),date=$('date').value;if(!Number.isFinite(val)||val<0||!date)return;results.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),metric:selected,value:val,date,note:$('note').value.trim(),created:Date.now()});save();page='detail';render();toast('Result saved!')})}render();
</script></body></html>
