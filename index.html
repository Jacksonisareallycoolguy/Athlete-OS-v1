  url: 'https://vkhrhgfdmdfxikhsppxb.supabase.co',

function readLocalResults() {
  try {
    const stored = JSON.parse(localStorage.getItem(key) || '[]');

}

function cloudPanel() {
  let controls;

    controls = `<p>Signed in as ${esc(cloudUser.email || 'your account')}.</p>

  } else {
    controls = `<form onsubmit="connectCloud(event)">
      <div class="field"><label for="cloud-email">Email</label><input type="email" id="cloud-email" name="email" autocomplete="username" required></div>
      <div class="field"><label for="cloud-password">Password</label><input type="password" id="cloud-password" name="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit">Sign in</button>
      <p class="muted small">Use your account from this Supabase project. Signed-out results are saved in this browser.</p>

  }
  return `<div class="panel"><h3>Supabase sync</h3>
    <fieldset style="border:0;padding:0;margin:0;min-width:0" ${cloudBusy ? 'disabled' : ''}>${controls}</fieldset>

  </div>`;
}

async function openCloudClient(config) {
  const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/+esm');
  cloudClient?.auth.stopAutoRefresh();
  return createClient(config.url, config.publishable, {auth: {detectSessionInUrl: false}});
}

async function runCloud(action) {
  if (cloudBusy) return;
  cloudBusy = true;
  const initialPage = page;
  const entryForm = page === 'add' ? $('entry') : null;
  cloudMessage = 'Working…';
  if (!entryForm) render();
  try {
    cloudMessage = await action() || '';
  } catch (error) {
    cloudMessage = error.message || 'Supabase request failed.';
    toast(cloudMessage);
  } finally {
    cloudBusy = false;
    if (!(entryForm && initialPage === page && $('entry') === entryForm)) render();
  }
}

function connectCloud(event) {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  return runCloud(async () => {
    cloudClient ||= await openCloudClient(cloudConfig);
    const {data, error} = await cloudClient.auth.signInWithPassword({
      email: form.get('email').trim(), password: form.get('password')
    });
    if (error) throw error;
    cloudUser = data.user;
    cloudReady = false;
    results = [];
    return refreshCloudResults();
  });
}

async function restoreCloudSession() {
  await runCloud(async () => {
    cloudClient ||= await openCloudClient(cloudConfig);
    const {data, error} = await cloudClient.auth.getSession();
    if (error) throw error;
    if (!data.session) return 'Sign in to access your cloud results.';
    cloudUser = data.session.user;
    cloudReady = false;
    results = [];
    return refreshCloudResults();
  });
}

async function refreshCloudResults() {
  const fetched = [];
  const pageSize = 500;
  for (let offset = 0; ; offset += pageSize) {
    const {data, error} = await cloudClient.from(tableName)
      .select('id,metric,value,date,note,created')
      .eq('user_id', cloudUser.id).order('id').range(offset, offset + pageSize - 1);
    if (error) throw error;
    fetched.push(...data);
    if (data.length < pageSize) break;
  }
  results = fetched;
  cloudReady = true;
  return `${results.length} results loaded from Supabase.`;
}

async function writeCloudResults(entries) {
  if (!cloudReady) throw Error('Refresh cloud results in Settings before saving.');
  for (let offset = 0; offset < entries.length; offset += 200) {
    const batch = entries.slice(offset, offset + 200).map(entry => ({
      ...entry, user_id: cloudUser.id
    }));
    const {data, error} = await cloudClient.from(tableName).upsert(batch, {
      onConflict: 'user_id,id', ignoreDuplicates: true
    }).select('id,metric,value,date,note,created');
    if (error) throw error;
    results.push(...data);
  }
}

async function uploadLocalResults() {
  const uploadedKey = `${key}:uploaded:${cloudUser.id}`;
  const uploaded = new Set(JSON.parse(localStorage.getItem(uploadedKey) || '[]'));
  const pending = readLocalResults().filter(entry => !uploaded.has(entry.id));
  if (!pending.length) return 'There are no new browser results to upload.';
  await writeCloudResults(pending);
  for (const entry of pending) uploaded.add(entry.id);
  localStorage.setItem(uploadedKey, JSON.stringify([...uploaded]));
  return `${pending.length} browser results synced.`;
}

async function signOutOfCloud() {
  const {error} = await cloudClient.auth.signOut({scope: 'local'});
  if (error) throw error;
  cloudUser = undefined;
  cloudReady = false;
  results = readLocalResults();
  return 'Signed out.';
}

async function saveEntries(entries) {
  if (cloudUser) return writeCloudResults(entries);
  const known = new Set(results.map(entry => entry.id));
  results.push(...entries.filter(entry => !known.has(entry.id)));
  save();
}

const metrics=Object.entries(categories).flatMap(([category,rows])=>rows.map(([name,unit,better])=>({id:name,category,name,unit,better})));const byId=id=>metrics.find(m=>m.id===id);const key='athlete-os-v1-results';let results=[];try{results=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(results))results=[]}catch{results=[]}let page='home',category='All',selected='40-yard dash';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:3});const dated=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});const sorted=id=>results.filter(r=>r.metric===id).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);const latest=id=>sorted(id).at(-1);const best=id=>{let a=sorted(id),m=byId(id);if(!a.length)return null;if(m.better==='neutral')return a.at(-1);return a.reduce((x,y)=>m.better==='low'?(x.value<y.value?x:y):(x.value>y.value?x:y))};const label=(m,r)=>r?fmt(r.value)+' '+m.unit:'—';const section=(title,body)=>`<div class="section"><h2>${title}</h2></div>${body}`;function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}function save(){localStorage.setItem(key,JSON.stringify(results))}function nav(p){page=p;render();scrollTo(0,0)}function choose(id){selected=id;nav('detail')}function navHtml(){return `<nav class="tabs"><div>${[['home','⌂','Home'],['metrics','▤','Metrics'],['add','＋','Add Result'],['progress','▥','Progress']].map(([p,ic,t])=>`<button class="tab ${page===p?'active':''}" onclick="nav('${p}')"><span class="sym">${ic}</span>${t}</button>`).join('')}</div></nav>`}function header(){return `<div class="top"><div class="brand"><div class="logo">↗</div><div><div class="brandname">ATHLETE OS</div><div class="eyebrow">FOOTBALL DEVELOPMENT</div></div></div><button class="ghost" onclick="nav('settings')">⚙</button></div>`}function home(){let featured=['40-yard dash','Standing vertical jump','Bench press estimated 1RM','Body weight'];return `<div class="eyebrow">YOUR PERFORMANCE</div><h1 class="heading">Development Dashboard</h1><p class="intro">Train on your schedule. Log whenever you want.</p><div class="grid">${featured.map(id=>{let m=byId(id),r=latest(id);return `<div class="panel"><div class="statlabel">${esc(id.replace(' estimated 1RM','').toUpperCase())}</div><div class="statval">${r?fmt(r.value):'—'} <span class="unit">${r?m.unit:''}</span></div><div class="small muted">${r?dated(r.date):'No results yet'}</div></div>`}).join('')}</div>${section('Quick actions',`<div class="row"><button class="primary" onclick="nav('add')">＋ Add result</button><button class="ghost" onclick="nav('metrics')">Browse 37 metrics</button></div>`)}${section('Recent results',results.length?`<div class="panel">${results.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,6).map(r=>`<div class="item"><div><strong>${esc(r.metric)}</strong><div class="muted">${dated(r.date)}</div></div><strong>${fmt(r.value)} ${byId(r.metric).unit}</strong></div>`).join('')}</div>`:`<div class="empty panel">No results recorded yet.<br><br><button class="primary" onclick="nav('add')">Log your first test</button></div>`)}<p class="intro spaced">No scheduled tests. No streaks. Your data, your pace.</p>`}function metricList(){let cats=['All',...Object.keys(categories)];return `<h1 class="heading">Your Metrics</h1><p class="intro">All ${metrics.length} tracked measurements, ready whenever you are.</p><div class="filters">${cats.map((c,i)=>`<button class="chip ${category===c?'selected':''}" onclick="category=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${i===0?'All':esc(c)}</button>`).join('')}</div>${metrics.filter(m=>category==='All'||m.category===category).map(m=>`<button class="metriccard" onclick="choose(${JSON.stringify(m.id).replace(/"/g,'&quot;')})"><span><strong>${esc(m.name)}</strong><small>${esc(m.category)}</small></span><span style="text-align:right"><strong>${label(m,latest(m.id))}</strong><small>${latest(m.id)?'Last '+dated(latest(m.id).date):'Not tested'} →</small></span></button>`).join('')}`}function options(sel){return metrics.map(m=>`<option value="${esc(m.id)}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('')}function add(){let m=byId(selected);return `<h1 class="heading">Add a Result</h1><p class="intro">Any metric. Any day. No required schedule.</p><form id="entry" class="panel"><div class="field"><label for="metric">Metric</label><select id="metric" onchange="selected=this.value;render()">${options(selected)}</select></div><div class="field"><label for="value">Result (${esc(m.unit)})</label><input id="value" type="number" inputmode="decimal" step="any" min="0" required placeholder="Enter a number"></div><div class="field"><label for="date">Date tested</label><input id="date" type="date" required value="${new Date().toLocaleDateString('en-CA')}"></div><div class="field"><label for="note">Notes (optional)</label><input id="note" maxlength="240" placeholder="Surface, shoes, conditions, etc."></div><button class="primary full" type="submit">Save result</button></form><div class="hint spaced">Tip: For estimated 1RM, enter your calculated estimate. Future versions can calculate this from weight and reps automatically.</div>`}const chartRanges = {
  week: {label: '1W', description: 'Last week', days: 7},
  month: {label: '1M', description: 'Last month', months: 1},
  sixMonths: {label: '6M', description: 'Last 6 months', months: 6},
  year: {label: '1Y', description: 'Last year', months: 12},

let chartRange = 'all';

function chartResults(data, range, today = new Date()) {
  if (range === 'all') return data;
  const {days, months} = chartRanges[range];
  const end = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
  const start = new Date(end);
  if (days) {
    start.setUTCDate(start.getUTCDate() - days + 1);
  } else {
    start.setUTCDate(1);
    start.setUTCMonth(start.getUTCMonth() - months);
    const lastDay = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 0));
    start.setUTCDate(Math.min(end.getUTCDate(), lastDay.getUTCDate()));
  }
  const firstDate = start.toISOString().slice(0, 10);
  const lastDate = end.toISOString().slice(0, 10);
  return data.filter(result => result.date >= firstDate && result.date <= lastDate);
}

function chartContent(data, unit) {
  const visible = chartResults(data, chartRange);
  if (!visible.length && chartRange !== 'all') {
    return '<div class="empty">No results in this date range.</div>';
  }
  return plot(visible, unit);
}

function changeChartRange(range, button) {
  chartRange = range;
  for (const option of button.parentElement.querySelectorAll('button')) {
    const active = option === button;
    option.classList.toggle('selected', active);
    option.setAttribute('aria-pressed', active);
  }
  $('progress-chart').innerHTML = chartContent(sorted(selected), byId(selected).unit);
}

function progressChart(data, unit) {

    <button type="button" class="chip ${chartRange === range ? 'selected' : ''}"
      aria-label="${description}" aria-pressed="${chartRange === range}"
      onclick="changeChartRange('${range}', this)">${label}</button>`).join('');
  return `<div class="panel">
    <div class="filters" role="group" aria-label="Progress graph date range">${buttons}</div>
    <div id="progress-chart" aria-live="polite">${chartContent(data, unit)}</div>
  </div>`;
}

function plot(data,unit){if(!data.length)return '<div class="empty">No data to chart yet.</div>';let vals=data.map(d=>d.value),mn=Math.min(...vals),mx=Math.max(...vals),spread=mx-mn||1;let days=data.map(d=>Date.parse(d.date+'T12:00:00')),t0=Math.min(...days),t1=Math.max(...days),range=t1-t0;let left=54,right=355,top=27,bottom=151;let pts=data.map((d,i)=>[range?(left+(days[i]-t0)/range*(right-left)):(data.length===1?(left+right)/2:left+i*(right-left)/(data.length-1)),mx===mn?(top+bottom)/2:bottom-((d.value-mn)/spread)*(bottom-top)]);let ticks=range?[t0,(t0+t1)/2,t1]:[t0];let shortDate=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:Math.abs(t1-t0)>31536000000?'2-digit':undefined});return `<div class="chart"><svg viewBox="0 0 380 190" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Results over time, from ${esc(dated(data[0].date))} to ${esc(dated(data.at(-1).date))}"><path d="M${left} ${top}H${right} M${left} ${(top+bottom)/2}H${right} M${left} ${bottom}H${right}" stroke="#263a55" stroke-width="1" fill="none"/><path d="M${left} ${top}V${bottom}H${right}" stroke="#5c6d86" fill="none"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" stroke="#5ba4ff" stroke-width="2.5" fill="none" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#79b7ff"><title>${esc(dated(data[i].date))}: ${fmt(data[i].value)} ${esc(unit)}</title></circle>`).join('')}<text x="${left-6}" y="${top+4}" text-anchor="end" fill="#a5b8d2" font-size="10">${fmt(mx)}</text><text x="${left-6}" y="${bottom+4}" text-anchor="end" fill="#a5b8d2" font-size="10">${fmt(mn)}</text>${ticks.map((t,i)=>`<text x="${range?left+i*(right-left)/2:(data.length===1?(left+right)/2:left)}" y="174" text-anchor="${i===0?'start':i===ticks.length-1?'end':'middle'}" fill="#a5b8d2" font-size="10">${esc(shortDate(t))}</text>`).join('')}<text x="${(left+right)/2}" y="187" text-anchor="middle" fill="#7185a4" font-size="9">DATE TESTED</text></svg></div>`}function detail(){let m=byId(selected),data=sorted(selected),b=best(selected),last=latest(selected),first=data[0],improve=first&&last&&first.value>0&&m.better!=='neutral'?((m.better==='low'?first.value-last.value:last.value-first.value)/first.value*100):null;return `<button class="ghost" onclick="nav('metrics')">← All metrics</button><div class="eyebrow spaced">${esc(m.category)}</div><h1 class="heading">${esc(m.name)}</h1><p class="intro">Measured in ${esc(m.unit)} · ${m.better==='low'?'Lower is better':m.better==='high'?'Higher is better':'Track changes over time'}</p><div class="grid"><div class="panel"><div class="statlabel">LATEST</div><div class="statval">${label(m,last)}</div></div><div class="panel"><div class="statlabel">${m.better==='neutral'?'MOST RECENT':'PERSONAL RECORD'}</div><div class="statval">${label(m,b)}</div></div></div>${improve!==null?`<div class="hint spaced">${improve>=0?'▲':'▼'} ${Math.abs(improve).toFixed(1)}% ${improve>=0?'improvement':'change in the wrong direction'} from your first result.</div>`:''}${section('Progress',progressChart(data,m.unit))}<div class="section"><h2>History (${data.length})</h2><button class="primary" onclick="selected=${JSON.stringify(m.id).replace(/"/g,'&quot;')};nav('add')">＋ Log</button></div><div class="panel">${data.length?data.slice().reverse().map(r=>`<div class="item"><div><strong>${fmt(r.value)} ${esc(m.unit)}</strong><div class="muted">${dated(r.date)}${r.note?' · '+esc(r.note):''}</div></div><button class="ghost mini" onclick="removeResult('${r.id}')">Delete</button></div>`).join(''):'<div class="empty">No measurements yet.</div>'}</div>`}function progress(){let tested=metrics.filter(m=>sorted(m.id).length);return `<h1 class="heading">Progress</h1><p class="intro">Personal records and trends from your recorded tests.</p><div class="grid"><div class="panel"><div class="statlabel">METRICS TESTED</div><div class="statval">${tested.length}<span class="unit"> / ${metrics.length}</span></div></div><div class="panel"><div class="statlabel">RESULTS LOGGED</div><div class="statval">${results.length}</div></div></div>${section('Explore trends',tested.length?tested.map(m=>`<button class="metriccard" onclick="choose(${JSON.stringify(m.id).replace(/"/g,'&quot;')})"><span><strong>${esc(m.name)}</strong><small>${sorted(m.id).length} results</small></span><span><strong>${label(m,best(m.id))} →</strong></span></button>`).join(''):'<div class="empty panel">Start logging results to unlock progress charts.</div>')}`}function settings(){return `<h1 class="heading">Settings & Data</h1><p class="intro">Sign in to use the same results across designs and devices.</p>${cloudPanel()}<div class="panel spaced"><h3>Export your data</h3><p class="muted small">Download a CSV backup. Do this regularly before clearing browser data.</p><button class="primary" onclick="exportCSV()">↓ Export CSV</button></div><div class="panel spaced"><h3>Import results</h3><p class="muted small">Restore a CSV previously exported from this app. Imported results are merged by ID.</p><input type="file" id="importFile" accept=".csv,text/csv" onchange="importCSV(this.files[0])"></div><div class="panel spaced"><h3>About this version</h3><p class="muted small">Track ${metrics.length} metrics with personal records, charts, and on-demand entries.</p></div>`}function removeResult(id) {
  if (cloudBusy || !confirm('Delete this result?')) return;
  return runCloud(async () => {
    if (cloudUser) {
      if (!cloudReady) throw Error('Refresh cloud results in Settings before deleting.');
      const {error} = await cloudClient.from(tableName).delete()
        .eq('user_id', cloudUser.id).eq('id', id);
      if (error) throw error;
    }
    results = results.filter(result => result.id !== id);
    if (!cloudUser) save();
    toast('Result deleted');
  });
}
function exportCSV(){let lines=[['id','metric','value','date','note','created'],...results.map(r=>[r.id,r.metric,r.value,r.date,r.note||'',r.created])];let csv=lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='athlete-os-backup-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function parseCSV(str){let rows=[],row=[],cell='',quote=false;for(let i=0;i<str.length;i++){let c=str[i];if(quote){if(c==='"'&&str[i+1]==='"'){cell+='"';i++}else if(c==='"')quote=false;else cell+=c}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}function importCSV(file) {
  if (!file) return;
  return runCloud(async () => {
    const rows = parseCSV(await file.text());
    if (rows[0]?.join(',') !== 'id,metric,value,date,note,created') {
      throw Error('Choose a CSV exported from Athlete OS.');
    }
    const known = new Set(results.map(entry => entry.id));
    const entries = [];
    for (const [id, metric, value, date, note, created] of rows.slice(1)) {
      if (!id || known.has(id) || !byId(metric) || !Number.isFinite(+value) ||
          +value < 0 || !/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
      const timestamp = Number(created);
      known.add(id);
      entries.push({id, metric, value: +value, date, note: note || '',
        created: Number.isSafeInteger(timestamp) && timestamp > 0 ? timestamp : Date.now()});
    }
    await saveEntries(entries);
    toast('Imported ' + entries.length + ' results');
  });
}

function render() {
  const views = {home, metrics: metricList, add, progress, detail, settings};
  $('app').innerHTML = header() + views[page]() + navHtml();
  if (page !== 'add') return;
  $('entry').addEventListener('submit', event => {
    event.preventDefault();
    if (cloudBusy) return;
    const value = Number($('value').value);
    const date = $('date').value;
    if (!Number.isFinite(value) || value < 0 || !date) return;
    const entry = {
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
      metric: selected, value, date, note: $('note').value.trim(), created: Date.now()
    };
    return runCloud(async () => {
      await saveEntries([entry]);
      selected = entry.metric;
      page = 'detail';
      toast('Result saved!');
    });
  });
}
render();
restoreCloudSession();
</script></body></html>
